name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Build (if script exists)
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script found; skipping build step."
          fi

