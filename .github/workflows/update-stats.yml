name: Update Portfolio Stats

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:



permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch GitHub Data (Stats)
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_PAT }}
        run: python fetch/fetch_contributions.py

      - name: Fetch Project Details (Node)
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_PAT }}
        run: node scripts/fetch-project-details.js

      - name: Update Dynamic README
        run: node scripts/update-readme.js

      # Chronicler disabled - summaries are manually managed per page
      # - name: Run Agentic Chronicler (Python)
      #   env:
      #     OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      #   run: python fetch/agentic_chronicler.py

      - name: Propagate Data to Sub-directories
        run: |
          cp fetch/data.json data.json
          # Dynamically propagate to all subdirectories (excluding specific system/node folders)
          find . -maxdepth 1 -type d ! -name "." ! -name ".*" ! -name "scripts" ! -name "fetch" ! -name "node_modules" ! -name "adapters" ! -name "core" ! -name "docs" ! -name "examples" ! -name "packs" ! -name "tests" ! -name "PAI" ! -name "portable-pai-core" -exec cp fetch/data.json {}/data.json \; -exec cp project-details.json {}/project-details.json \;
          # Safely handle specific nested directories where we explicitly also want stats
          [ -d "airbnb/aircover" ] && cp fetch/data.json airbnb/aircover/data.json || true

      - name: Commit updated data
        run: |
          git config --global user.email 'actions@github.com'
          git config --global user.name 'GitHub Actions'
          git add -A
          git diff --staged --quiet || git commit -m "Update portfolio stats & README [skip ci]"
          git push
