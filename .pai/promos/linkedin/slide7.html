<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 7: Rapid Enterprise Deployment</title>
    <style>
        :root {
            --bg: #fbf9f1;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            height: 1350px;
            width: 1080px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        p {
            font-size: 32px;
            color: #4b5563;
            margin-bottom: 80px;
        }

        .button-ui {
            background: white;
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 600px;
            margin: 0 auto;
            border: 4px solid #10b981;
            position: relative;
        }

        .btn {
            background: #10b981;
            color: white;
            padding: 30px 60px;
            border-radius: 20px;
            font-size: 36px;
            font-weight: 800;
            display: inline-block;
            cursor: pointer;
            box-shadow: 0 10px 0 #059669;
        }

        .label {
            font-size: 24px;
            color: #6b7280;
            margin-top: 30px;
            font-weight: 600;
        }

        .pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 40px;
            border: 4px solid #10b981;
            opacity: 0;
            animation: ripple 2s infinite ease-out;
        }

        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Rapid Enterprise Deployment</h1>
        <p>Governance in seconds, across any project.</p>
        <div class="button-ui">
            <div class="pulse"></div>
            <div class="btn">Deploy Safety Guard</div>
            <div class="label">One-click protection for all repositories</div>
        </div>
    </div>
</body>

</html>
