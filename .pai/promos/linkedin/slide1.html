<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Slide 1: Title</title>
    <style>
        :root {
            --bg-color: #fbf9f1;
            --text-color: #1a1a1a;
            --accent-color: #3b82f6;
            /* Trust Blue */
            --shield-color: #10b981;
            /* Safety Green */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            width: 80%;
            text-align: center;
            animation: fadeIn 1.5s ease-out forwards;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.1;
        }

        p {
            font-size: 32px;
            color: #666;
            margin-bottom: 60px;
        }

        .visual {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }

        .shield {
            width: 120px;
            height: 140px;
            background-color: var(--shield-color);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            animation: pulse 3s infinite ease-in-out;
            z-index: 10;
        }

        .shield::after {
            content: "🛡️";
            font-size: 60px;
        }

        .tool {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            animation: drift 5s infinite ease-in-out;
        }

        .line {
            position: absolute;
            top: 50%;
            left: 50%;
            height: 2px;
            background: rgba(0, 0, 0, 0.1);
            transform-origin: left center;
            z-index: 1;
        }

        /* Positions */
        .t1 {
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0s;
        }

        .t2 {
            top: 30%;
            left: 85%;
            animation-delay: 0.5s;
        }

        .t3 {
            top: 70%;
            left: 85%;
            animation-delay: 1s;
        }

        .t4 {
            top: 90%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.5s;
        }

        .t5 {
            top: 70%;
            left: 15%;
            animation-delay: 2s;
        }

        .t6 {
            top: 30%;
            left: 15%;
            animation-delay: 2.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        @keyframes drift {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>The AI Governance<br>Framework</h1>
        <p>Scaling AI Engineering without sacrificing safety.</p>
        <div class="visual">
            <div class="shield"></div>
            <div class="tool t1">⚙️</div>
            <div class="tool t2">💻</div>
            <div class="tool t3">📊</div>
            <div class="tool t4">🔍</div>
            <div class="tool t5">🚀</div>
            <div class="tool t6">🛡️</div>
        </div>
    </div>
</body>

</html>
