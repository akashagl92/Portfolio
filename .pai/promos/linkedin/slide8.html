<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 8: The Vision</title>
    <style>
        :root {
            --bg: #fbf9f1;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            height: 1350px;
            width: 1080px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 40px;
            color: #1a1a1a;
        }

        p {
            font-size: 36px;
            color: #4b5563;
            margin-bottom: 80px;
            line-height: 1.5;
        }

        .cta-card {
            background: white;
            padding: 80px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border-top: 10px solid #3b82f6;
        }

        h2 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .cta-text {
            font-size: 32px;
            margin-bottom: 40px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            padding: 25px 50px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: 700;
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>The Vision</h1>
        <p>Building a self-correcting engineering organization that is resilient, transparent, and scalable.</p>
        <div class="cta-card">
            <h2>Ready to Lead the AI Transition?</h2>
            <div class="cta-text">How are you governing your engineering team? Let's discuss.</div>
            <div class="btn">Let's Connect 🤝</div>
        </div>
    </div>
</body>

</html>
