<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Slide 5: Circuit Breaker</title>
    <style>
        :root {
            --bg-color: #fbf9f1;
            --text-color: #1a1a1a;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --accent-color: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .slide-container {
            width: 90%;
            height: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .flow {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            margin-top: 50px;
        }

        .node {
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            font-weight: 600;
            font-size: 20px;
            position: relative;
        }

        .node .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .arrow {
            width: 100px;
            height: 4px;
            background: #e5e7eb;
            position: relative;
        }

        .arrow::after {
            content: "";
            position: absolute;
            right: 0;
            top: -6px;
            border-left: 12px solid #e5e7eb;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }

        .signal {
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            position: absolute;
            top: -4px;
            left: 0;
            animation: moveSignal 2s infinite linear;
        }

        .breaker {
            border: 4px solid var(--accent-color);
            animation: checkCycle 4s infinite;
        }

        .status-badge {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 60px;
            animation: statusPulse 4s infinite;
        }

        @keyframes moveSignal {
            0% {
                left: 0;
                opacity: 1;
            }

            80% {
                left: 100%;
                opacity: 1;
            }

            100% {
                left: 100%;
                opacity: 0;
            }
        }

        @keyframes checkCycle {

            0%,
            40% {
                border-color: var(--accent-color);
                transform: scale(1);
            }

            50% {
                border-color: var(--danger-color);
                transform: scale(1.1);
            }

            60%,
            100% {
                border-color: var(--accent-color);
                transform: scale(1);
            }
        }

        @keyframes statusPulse {

            0%,
            40% {
                background: #dbeafe;
                color: #1e40af;
                content: "Checking Policy...";
            }

            50% {
                background: #fee2e2;
                color: #991b1b;
                content: "RISK DETECTED";
            }

            60%,
            100% {
                background: #dcfce7;
                color: #166534;
                content: "SAFE TO DEPLOY";
            }
        }

        .status-badge::before {
            content: "Monitoring System...";
            animation: textSwap 4s infinite;
        }

        @keyframes textSwap {

            0%,
            40% {
                content: "🔍 Analyzing Intent...";
            }

            50% {
                content: "🛑 Blocked Unsafe Commit";
            }

            60%,
            100% {
                content: "✅ Policy Cleared";
            }
        }
    </style>
</head>

<body>
    <div class="slide-container">
        <h2>The AI Coding Circuit Breaker</h2>
        <div class="flow">
            <div class="node">
                <div class="icon">🤖</div>
                AI Action
            </div>
            <div class="arrow">
                <div class="signal"></div>
            </div>
            <div class="node breaker">
                <div class="icon">🛡️</div>
                Governance
            </div>
            <div class="arrow">
                <div class="signal"></div>
            </div>
            <div class="node">
                <div class="icon">🚀</div>
                Deployment
            </div>
        </div>
        <div class="status-badge"></div>
    </div>
</body>

</html>
